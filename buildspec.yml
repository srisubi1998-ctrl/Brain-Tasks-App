version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "brain-tasks-app"
    EKS_CLUSTER_NAME: "brain-tasks-cluster"

phases:
  install:
    commands:
      - echo "Installing kubectl matching the cluster version"
      - K8S_VERSION=$(aws eks describe-cluster --name $EKS_CLUSTER_NAME --region $AWS_DEFAULT_REGION --query cluster.version --output text)
      - KUBECTL_VERSION=$(curl -Ls https://dl.k8s.io/release/stable-$K8S_VERSION.txt)
      - curl -LO "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
      - install -m 0755 kubectl /usr/local/bin/kubectl
      - kubectl version --client
  pre_build:
    commands:
      - echo "Logging in to ECR"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
  build:
    commands:
      - echo "Building Docker image"
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest
  post_build:
    commands:
      - echo "Pushing image"
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - echo "Updating manifest with the new image"
      - 'sed -i "s|image:.*|image: $REPOSITORY_URI:$IMAGE_TAG|" k8s/deployment.yaml'
      - echo "Deploying to EKS with kubectl"
      - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_DEFAULT_REGION
      - kubectl apply -f k8s/
      - kubectl rollout status deployment/brain-tasks-app --timeout=180s

artifacts:
  files:
    - k8s/**/*
